{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <h1 class="page-title">Add New Plane</h1>
    <a href="{{ url_for('planes') }}" class="btn btn-outline">← Back to Planes</a>
</div>
<div class="form-container">
    <form method="post" action="{{ url_for('add_plane') }}" class="add-form">
        <div class="form-group">
            <label class="form-label">Plane Type</label>
            <select name="plane_type" class="form-input" required>
                {% for t in types %}
                <option value="{{ t }}">{{ t }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Destination</label>
            <select name="destination" class="form-input" required>
                {% for d in destinations %}
                <option value="{{ d }}">{{ d }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Fuel Level (%)</label>
            <input type="number" name="fuel" min="10" max="100" value="100" step="1" class="form-input" required>
        </div>
        <button type="submit" class="btn btn-success btn-lg">✚ Add Plane</button>
    </form>
</div>
{% endblock %}
